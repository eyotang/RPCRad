syntax = "proto3";
package user.v1;
service UserService {
  rpc GetUser(GetUserRequest) returns (User);
  rpc ListUsers(ListUsersRequest) returns (UserList);
  rpc CreateUser(CreateUserRequest) returns (User);
  rpc WatchUsers(GetUserRequest) returns (stream User);
}
message GetUserRequest { string user_id = 1; bool include_profile = 2; }
message ListUsersRequest { int32 page_size = 1; }
message CreateUserRequest { string name = 1; string email = 2; }
message Profile { string team = 1; string role = 2; string region = 3; }
message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string status = 4;
  Profile profile = 5;
  string created_at = 6;
}
message UserList { repeated User users = 1; int32 total = 2; }
