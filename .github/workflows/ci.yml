name: Checks and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpcrad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
env:
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: '14.0'
jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/demo/go.mod
          cache-dependency-path: tools/demo/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sh tools/setup.sh
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: python3 -m unittest discover -s tools/tests
      - run: cargo build --locked
      - run: sh tools/smoke.sh
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/demo/go.mod
          cache-dependency-path: tools/demo/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: sh tools/setup.sh
      - name: Build DMG and compatible latest.json
        run: python3 tools/release.py --tag "$GITHUB_REF_NAME"
      - name: Test packaged application
        run: sh tools/smoke.sh dist/release/RPCRad.app/Contents/MacOS/RPCRad
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --verify-tag --draft --title "RPCRad ${tag#v}" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" "release-assets/$tag/"* --clobber
          gh release edit "$tag" --draft=false --latest
