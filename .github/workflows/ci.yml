name: Checks and releases
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpcrad-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macos-arm64
            app: dist/release/RPCRad.app/Contents/MacOS/RPCRad
          - os: macos-15-intel
            platform: macos-x64
            app: dist/release/RPCRad.app/Contents/MacOS/RPCRad
          - os: windows-2022
            platform: windows-x64
            app: dist/windows-x64/RPCRad/RPCRad.exe
          - os: ubuntu-24.04
            platform: linux-x64
            app: dist/linux-x64/RPCRad/rpcrad
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/demo/go.mod
          cache-dependency-path: tools/demo/go.sum
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Linux native and packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ clang cmake ninja-build pkg-config libfontconfig-dev libwayland-dev libwebkit2gtk-4.1-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 vulkan-validationlayers mesa-vulkan-drivers xvfb xauth fonts-noto-core fonts-noto-cjk xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk zstd
      - name: Windows installer compiler
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: release-${{ matrix.platform }}
          cache-on-failure: true
      - run: python tools/setup.py
      - run: cargo fmt --all -- --check
      - run: python -m unittest discover -s tools/tests
      - run: cargo test --release --locked
      - name: Clippy
        if: matrix.platform == 'macos-arm64'
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Build native packages
        id: package
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "v$version"; fi
          python tools/release.py --tag "v$version" --platform '${{ matrix.platform }}'
          echo "assets=release-assets/v$version" >> "$GITHUB_OUTPUT"
      - name: Test relocated native application
        if: runner.os != 'Linux'
        run: python tools/smoke.py --app '${{ matrix.app }}' --packaged --gui
      - name: Test Ubuntu package and X11 rendering
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./release-assets/v*/*.deb
          xvfb-run -a python tools/smoke.py --app /opt/rpcrad/rpcrad --packaged --gui
      - name: Test Windows installation and uninstall
        if: runner.os == 'Windows'
        run: python tools/windows-install-smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.platform }}
          path: ${{ steps.package.outputs.assets }}
          if-no-files-found: error
          retention-days: 14
  arch-wayland:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packages-linux-x64
          path: arch-packages
      - name: Install Arch package and verify Wayland rendering
        run: |
          docker run --rm -v "$PWD:/work" -w /work archlinux:base-devel bash -euc '
            pacman -Syu --noconfirm --needed python go git fontconfig freetype2 libxkbcommon libxkbcommon-x11 libxcb libx11 wayland vulkan-icd-loader vulkan-swrast alsa-lib openssl zstd xdg-utils xdg-desktop-portal xdg-desktop-portal-gtk noto-fonts noto-fonts-cjk weston dbus
            pacman -U --noconfirm arch-packages/*.pkg.tar.zst
            git config --global --add safe.directory /work
            python tools/setup.py
            python tools/wayland-smoke.py
          '
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, arch-wayland]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: release-assets/${{ github.ref_name }}
      - name: Validate every platform before publishing the update manifest
        run: python tools/release.py --tag "$GITHUB_REF_NAME" --manifest-only
      - name: Upload complete release then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --verify-tag --draft --title "RPCRad ${tag#v}" --notes-file "docs/releases/$tag.md"
          fi
          gh release upload "$tag" "release-assets/$tag/"* --clobber
          gh release edit "$tag" --draft=false --latest
