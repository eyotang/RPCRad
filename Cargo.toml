[package]
name = "rpcrad"
version = "0.2.0"
edition = "2024"
description = "A local gRPC workbench built with GPUI and GPUI Kit"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["tree-sitter"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rhai = { version = "1", features = ["serde", "sync", "no_module"] }
hmac = "0.12"
sha2 = "0.10"
md-5 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
getrandom = "0.3"
zeroize = "1"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "=0.1.34"

[profile.dev]
debug = 0
strip = "none"

[profile.release]
lto = "thin"
strip = true


# Keep build-time macro libraries loadable with the macOS linker.
[profile.release.build-override]
strip = "none"
